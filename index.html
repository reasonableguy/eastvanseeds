<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-61FCJCWNV3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-61FCJCWNV3');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="css.css">

    <meta property="og:title" content="East Van Seeds">
    <meta property="og:url" content="https://eastvanseeds.com/?og=1">
    <link rel="icon" href="https://d33wubrfki0l68.cloudfront.net/75aa8000-bf15-4f8e-aed4-2c12bff23066/Favicon%20copy.png" type="image/png">
    <title>East Van Seeds</title>

    <style>
        .headingplant,
        .headinggarden,
        .headingrecipe {
            color: #000;
        }

        @media only screen and (max-width: 600px) {
            .headingplant h2,
            .headinggarden h2 {
                font-size: 1.3em;
            }
        }

        /* Makes sure the loaded month content is visible */
        #month-content > * {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <div class="headblock">
            <div class="logo">
                <a href="/"><img src="https://d33wubrfki0l68.cloudfront.net/fc2f163f-8653-46f6-a80a-285e86037be5/EVS%20RECTANGLE.png" alt="Logo"></a>
            </div>
            <div class="menu-icon" id="menu-icon">&#9776;</div>
            <div class="drawer" id="drawer">
                <span class="close-button" id="close-button">&times;</span>
                <ul>
                    <iframe src="nav.html" onload="this.insertAdjacentHTML('afterend', (this.contentDocument.body||this.contentDocument).innerHTML);this.remove()"></iframe>
                </ul>
            </div>
        </div>
    </header>

    <!-- Current month's content loads here automatically -->
    <div id="month-content"></div>

    <script>
        // Current month name in Vancouver time, e.g. "november"
        const month = new Date()
            .toLocaleString('en-US', { month: 'long', timeZone: 'America/Vancouver' })
            .toLowerCase();

        fetch('/month/' + month + '.html')
            .then(response => {
                if (!response.ok) throw new Error('Could not load ' + month + '.html');
                return response.text();
            })
            .then(html => {
                document.getElementById('month-content').innerHTML = html;
            })
            .catch(error => console.error(error));
    </script>

    <div class="heading container">
        <h2>Check out our photos on Instagram</h2>
    </div>

    <div class="ig-iframe-container container">
        <iframe src="https://www.instagram.com/eastvanseeds/embed/" onload="this.insertAdjacentHTML('afterend', (this.contentDocument.body||this.contentDocument).innerHTML);this.remove()"></iframe>
    </div>

    <script>
        const menuIcon = document.getElementById("menu-icon");
        const closeIcon = document.getElementById("close-button");
        const drawer = document.getElementById("drawer");

        menuIcon.addEventListener("click", function () {
            drawer.classList.add("active");
            menuIcon.classList.add("active");
        });

        closeIcon.addEventListener("click", function () {
            drawer.classList.remove("active");
            menuIcon.classList.remove("active");
        });
    </script>
</body>
</html>
